<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progz Admin API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .role-banner {
      background: #92400e;
      color: #fff;
      padding: 10px 20px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .role-banner a { color: #fcd34d; }
  </style>
</head>
<body>
  <div class="role-banner">
    <strong>Admin API Docs</strong>
    <span>
      <a href="/api-docs/trainer/">Trainer</a> ·
      <a href="/api-docs/student/">Student</a> ·
      <a href="/api-docs/">All roles</a>
    </span>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script src="/api-docs/swagger-init.js"></script>
  <script>window.onload = () => initProgzSwagger("./swagger.yaml");</script>
</body>
</html>
