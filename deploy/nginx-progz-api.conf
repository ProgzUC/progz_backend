# Progz API — Linode nginx (api.progz.urbancode.in → port 5002)
# Install:
#   sudo cp deploy/nginx-progz-api.conf /etc/nginx/sites-available/progz-api
#   sudo ln -sf /etc/nginx/sites-available/progz-api /etc/nginx/sites-enabled/progz-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.progz.urbancode.in

server {
    listen 80;
    listen [::]:80;
    server_name api.progz.urbancode.in;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
